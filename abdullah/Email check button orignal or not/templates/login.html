<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Signup / Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    .box { max-width: 420px; margin: auto; padding: 24px; border: 1px solid #ddd; border-radius: 10px; }
    label { display:block; margin: 10px 0 4px; }
    input { width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; }
    button { margin-top:16px; padding:10px 14px; border:none; border-radius:8px; cursor:pointer; }
    .btn { background:#222; color:#fff; }
    .msg { margin: 10px 0; padding: 10px; border-radius: 6px; }
    .msg.error { background:#ffe9e9; color:#a40000; }
    .msg.success { background:#e9ffef; color:#006b2e; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Signup / Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="msg {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label>Name</label>
      <input type="text" name="name" value="{{ name or '' }}" required />

      <label>CNIC (12345-1234567-1)</label>
      <input type="text" name="cnic" value="{{ cnic or '' }}" placeholder="12345-1234567-1" required />

      <label>Email</label>
      <input type="email" name="email" value="{{ email or '' }}" placeholder="user@example.com" required />

      <button class="btn" type="submit">Send OTP</button>
    </form>
  </div>
</body>
</html>
